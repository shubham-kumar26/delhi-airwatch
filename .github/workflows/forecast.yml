name: forecast

on:
  workflow_run:
    workflows: ["hourly-ingest"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt prophet
      - name: Make forecasts
        run: python make_forecast.py
