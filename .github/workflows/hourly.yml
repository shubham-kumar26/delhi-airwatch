name: hourly-ingest

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest latest pollution readings
        run: python ingest_latest.py
      - name: Fill recent gaps (last 2 days of hourly data)
        env:
          DAYS: "2"
        run: python backfill_history.py
      - name: Ingest weather (last 3 days)
        env:
          PAST_DAYS: "3"
        run: python ingest_weather.py
      - name: Send alert emails
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: python send_alerts.py
